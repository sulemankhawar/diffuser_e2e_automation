name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

  workflow_dispatch:

  schedule:
    - cron: '0 9 * * 1-5'

    
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Configure DNS for SAP System
      run: |
        echo "10.0.3.87 bs4b5tap1.bti.local" | sudo tee -a /etc/hosts
    - name: Run Playwright tests
      run: npx playwright test
      env:
        TEST_ENV: staging
        SAP_TEST_PASSWORD: ${{ secrets.SAP_TEST_PASSWORD }}
        SAP_PASSWORD_TESTALL: ${{ secrets.SAP_PASSWORD_TESTALL }}
        SAP_PASSWORD_TESTADMIN: ${{ secrets.SAP_PASSWORD_TESTADMIN }}
        SAP_PASSWORD_TESTDISPLAY: ${{ secrets.SAP_PASSWORD_TESTDISPLAY }}
        SAP_PASSWORD_TESTMONITOR: ${{ secrets.SAP_PASSWORD_TESTMONITOR }}
        SAP_PASSWORD_TESTNO: ${{ secrets.SAP_PASSWORD_TESTNO }}
    - name: Upload HTML report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: reports/html/
        retention-days: 30
    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-test-results
        path: test-results/artifacts/
        retention-days: 30